name: Collect fares

# Snapshots the watch-list and commits the day's CSV partition. Costs
# (routes x horizons) SerpApi requests per run: 3 routes x 1 horizon = 3/day,
# ~90/month. Requires the SERPAPI_API_KEY repo secret. To pause, comment out
# `schedule` or disable the workflow in the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC daily (07:15 Puerto Rico)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Rebuild history from committed partitions
        run: airfare-collect import --from data/observations
      - name: Snapshot watch-list
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: airfare-collect run --watchlist data/sample/watchlist.txt --horizons 30 --max-requests 5 --export
      - name: Commit partition
        run: |
          if ! ls data/observations/*.csv >/dev/null 2>&1; then
            echo "::error::no partition was written; see the Snapshot step log"
            exit 1
          fi
          git config user.name "fare-collector"
          git config user.email "fare-collector@users.noreply.github.com"
          git add data/observations
          git diff --cached --quiet || git commit -m "data: fares $(date -u +%F)"
          git push

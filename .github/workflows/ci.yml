name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy airfare
      - run: pytest
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t airfare-marketplace .

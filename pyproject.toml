[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airfare-marketplace"
version = "0.5.0"
description = "Transparent airfare intelligence: provider-agnostic search, USD-normalized history, and price-drop forecasting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Julio Fontanet" }]
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "requests>=2.32,<3",
    "tenacity>=9.0,<10",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "altair>=5.4,<7",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "pre-commit>=4.0",
    "responses>=0.25",
]
notebook = ["jupyter>=1.1", "ipykernel>=6.29"]

[project.scripts]
airfare-train = "airfare.ml.train:main"
airfare-collect = "airfare.collect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["airfare"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["airfare", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S101", "E501"]
"airfare/storage/sqlite.py" = ["E501"]
"airfare/collect/partitions.py" = ["E501"]
"airfare/ui/*" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["airfare.ui.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false  # altair's chained builders are untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=airfare --cov-report=term-missing:skip-covered"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["airfare/ui/*"]
